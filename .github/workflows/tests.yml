# Прогон автотестов на каждый push. Приложение «Моменты» — приватный репозиторий,
# поэтому его клонируем по токену из секретов (APP_REPO_TOKEN: fine-grained PAT с правом Contents: read).
name: tests
on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Локальный Postgres для тестов: та же схема, что у приложения, отдельная база momenty_e2e.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: momenty
          POSTGRES_DB: momenty_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Клонируем приложение
        uses: actions/checkout@v4
        with:
          repository: holyboga/present_on_wedding
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости приложения
        run: npm ci
        working-directory: app

      - name: Зависимости тестов и браузер
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Тесты
        run: npm test
        env:
          CI: "true"
          APP_DIR: ${{ github.workspace }}/app
          E2E_DATABASE_URL: postgres://postgres:momenty@localhost:5432/momenty_e2e?sslmode=disable

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
